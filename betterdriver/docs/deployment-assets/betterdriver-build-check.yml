# Copy this file unchanged to the repository root:
# .github/workflows/betterdriver-build-check.yml
#
# BetterDriver is nested at betterdriver/ in this repository. The defaults below
# ensure every npm command runs against betterdriver/package.json, not the Git root.

name: BetterDriver Build Check

on:
  push:
    branches:
      - "feature/**"
      - "release/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: betterdriver-build-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, type-check and build BetterDriver
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: betterdriver

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: betterdriver/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Production build
        run: npm run build
