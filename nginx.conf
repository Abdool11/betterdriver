# ============================================================
#  BD — BetterDriver
#  Nginx reverse proxy configuration
#  Domain: betterdriver.co.za
#  Port:   3003
#
#  INSTRUCTIONS:
#  1. Copy this file to /etc/nginx/sites-available/bd
#  2. Run: sudo ln -s /etc/nginx/sites-available/bd /etc/nginx/sites-enabled/bd
#  3. Run: sudo nginx -t   (test config)
#  4. Run: sudo systemctl reload nginx
#  5. Run: sudo certbot --nginx -d betterdriver.co.za -d www.betterdriver.co.za
# ============================================================

server {
    listen 80;
    server_name betterdriver.co.za www.betterdriver.co.za;

    # Redirect HTTP to HTTPS (Certbot will update this block automatically)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name betterdriver.co.za www.betterdriver.co.za;

    # SSL certificates — Certbot will fill these in automatically
    # ssl_certificate /etc/letsencrypt/live/betterdriver.co.za/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/betterdriver.co.za/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Increase upload size for driver document uploads
    client_max_body_size 20M;

    # Proxy all requests to the Next.js server
    location / {
        proxy_pass http://localhost:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Cache static assets aggressively
    location /_next/static/ {
        proxy_pass http://localhost:3003;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
